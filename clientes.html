<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clientes - Vendedor de Água</title>

    <link rel="stylesheet" href="css/estilo.css">

    <style>
        .pagina {
            padding: 18px 14px;
        }

        .cabecalho-pagina {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .voltar {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 13px;
            background: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .cabecalho-pagina h2 {
            font-size: 21px;
        }

        .cabecalho-pagina p {
            color: #64748b;
            font-size: 12px;
            margin-top: 3px;
        }

        .formulario {
            background: white;
            padding: 17px;
            border-radius: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 18px;
        }

        .formulario h3 {
            margin-bottom: 14px;
            font-size: 17px;
        }

        .campo {
            margin-bottom: 12px;
        }

        .campo label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #475569;
        }

        .campo input,
        .campo textarea {
            width: 100%;
            border: 1px solid #dbe3ec;
            border-radius: 11px;
            padding: 13px;
            font-size: 14px;
            outline: none;
            font-family: Arial, Helvetica, sans-serif;
        }

        .campo input:focus,
        .campo textarea:focus {
            border-color: #0879d1;
        }

        .campo textarea {
            resize: vertical;
            min-height: 75px;
        }

        .botoes-form {
            display: flex;
            gap: 8px;
        }

        .btn-salvar {
            flex: 1;
            border: none;
            background: #0879d1;
            color: white;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-cancelar {
            border: none;
            background: #e2e8f0;
            color: #334155;
            padding: 14px 18px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }

        .pesquisa {
            width: 100%;
            border: none;
            background: white;
            padding: 14px;
            border-radius: 13px;
            margin-bottom: 12px;
            font-size: 14px;
            outline: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .contador {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 10px;
        }

        .cliente {
            background: white;
            border-radius: 17px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .cliente-topo {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #e0f2fe;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
        }

        .cliente-nome {
            flex: 1;
        }

        .cliente-nome strong {
            display: block;
            font-size: 15px;
        }

        .cliente-nome small {
            display: block;
            color: #64748b;
            margin-top: 3px;
        }

        .cliente-info {
            margin-top: 12px;
            padding-top: 11px;
            border-top: 1px solid #eef2f7;
            font-size: 12px;
            color: #475569;
            line-height: 1.7;
        }

        .acoes {
            display: flex;
            gap: 7px;
            margin-top: 12px;
        }

        .btn-editar,
        .btn-excluir {
            flex: 1;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-editar {
            background: #e0f2fe;
            color: #0369a1;
        }

        .btn-excluir {
            background: #fee2e2;
            color: #b91c1c;
        }

        .vazio {
            text-align: center;
            padding: 35px 15px;
            color: #94a3b8;
            background: white;
            border-radius: 17px;
        }

        .vazio span {
            display: block;
            font-size: 40px;
            margin-bottom: 8px;
        }
    </style>
</head>

<body>

<div class="app">

    <header class="topo">

        <div class="logo">💧</div>

        <div>
            <h1>Vendedor de Água</h1>
            <p>Clientes</p>
        </div>

    </header>


    <main class="pagina">

        <div class="cabecalho-pagina">

            <button class="voltar" onclick="window.location.href='index.html'">
                ‹
            </button>

            <div>
                <h2>👥 Clientes</h2>
                <p>Cadastre e controle seus clientes</p>
            </div>

        </div>


        <section class="formulario">

            <h3 id="tituloFormulario">
                ➕ Novo Cliente
            </h3>

            <input type="hidden" id="clienteId">

            <div class="campo">
                <label>Nome *</label>
                <input
                    type="text"
                    id="nome"
                    placeholder="Nome do cliente"
                    autocomplete="name"
                >
            </div>

            <div class="campo">
                <label>Telefone</label>
                <input
                    type="tel"
                    id="telefone"
                    placeholder="(00) 00000-0000"
                    autocomplete="tel"
                >
            </div>

            <div class="campo">
                <label>Endereço</label>
                <input
                    type="text"
                    id="endereco"
                    placeholder="Rua, número"
                    autocomplete="street-address"
                >
            </div>

            <div class="campo">
                <label>Bairro</label>
                <input
                    type="text"
                    id="bairro"
                    placeholder="Bairro"
                >
            </div>

            <div class="campo">
                <label>Observação</label>
                <textarea
                    id="observacao"
                    placeholder="Ex.: entregar pela manhã..."
                ></textarea>
            </div>

            <div class="botoes-form">

                <button
                    class="btn-salvar"
                    onclick="salvarCliente()"
                >
                    💾 SALVAR CLIENTE
                </button>

                <button
                    class="btn-cancelar"
                    id="btnCancelar"
                    onclick="cancelarEdicao()"
                >
                    CANCELAR
                </button>

            </div>

        </section>


        <input
            type="search"
            class="pesquisa"
            id="pesquisa"
            placeholder="🔎 Pesquisar cliente..."
            oninput="mostrarClientes()"
        >

        <div class="contador" id="contador">
            0 clientes cadastrados
        </div>

        <div id="listaClientes"></div>

    </main>

</div>


<script>

    const CHAVE_CLIENTES = "vendedor_agua_clientes";


    function obterClientes() {

        try {

            return JSON.parse(
                localStorage.getItem(CHAVE_CLIENTES)
            ) || [];

        } catch (erro) {

            return [];

        }

    }


    function salvarClientes(clientes) {

        localStorage.setItem(
            CHAVE_CLIENTES,
            JSON.stringify(clientes)
        );

    }


    function limparFormulario() {

        document.getElementById("clienteId").value = "";
        document.getElementById("nome").value = "";
        document.getElementById("telefone").value = "";
        document.getElementById("endereco").value = "";
        document.getElementById("bairro").value = "";
        document.getElementById("observacao").value = "";

        document.getElementById("tituloFormulario").textContent =
            "➕ Novo Cliente";

        document.querySelector(".btn-salvar").textContent =
            "💾 SALVAR CLIENTE";

        document.getElementById("btnCancelar").style.display =
            "none";

    }


    function salvarCliente() {

        const nome =
            document.getElementById("nome").value.trim();

        const telefone =
            document.getElementById("telefone").value.trim();

        const endereco =
            document.getElementById("endereco").value.trim();

        const bairro =
            document.getElementById("bairro").value.trim();

        const observacao =
            document.getElementById("observacao").value.trim();

        const id =
            document.getElementById("clienteId").value;


        if (!nome) {

            alert("Digite o nome do cliente.");

            document.getElementById("nome").focus();

            return;

        }


        const clientes = obterClientes();


        if (id) {

            const indice = clientes.findIndex(
                cliente => String(cliente.id) === String(id)
            );


            if (indice !== -1) {

                clientes[indice].nome = nome;
                clientes[indice].telefone = telefone;
                clientes[indice].endereco = endereco;
                clientes[indice].bairro = bairro;
                clientes[indice].observacao = observacao;
                clientes[indice].atualizadoEm =
                    new Date().toISOString();

            }

            alert("Cliente atualizado com sucesso.");

        } else {

            const novoCliente = {

                id: Date.now(),

                nome: nome,

                telefone: telefone,

                endereco: endereco,

                bairro: bairro,

                observacao: observacao,

                criadoEm: new Date().toISOString(),

                atualizadoEm: new Date().toISOString()

            };


            clientes.push(novoCliente);

            alert("Cliente cadastrado com sucesso.");

        }


        salvarClientes(clientes);

        limparFormulario();

        mostrarClientes();

    }


    function editarCliente(id) {

        const clientes = obterClientes();

        const cliente = clientes.find(
            item => String(item.id) === String(id)
        );


        if (!cliente) {
            return;
        }


        document.getElementById("clienteId").value =
            cliente.id;

        document.getElementById("nome").value =
            cliente.nome || "";

        document.getElementById("telefone").value =
            cliente.telefone || "";

        document.getElementById("endereco").value =
            cliente.endereco || "";

        document.getElementById("bairro").value =
            cliente.bairro || "";

        document.getElementById("observacao").value =
            cliente.observacao || "";


        document.getElementById("tituloFormulario").textContent =
            "✏️ Editar Cliente";

        document.querySelector(".btn-salvar").textContent =
            "💾 ATUALIZAR CLIENTE";

        document.getElementById("btnCancelar").style.display =
            "block";


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    function cancelarEdicao() {

        limparFormulario();

    }


    function excluirCliente(id) {

        const clientes = obterClientes();

        const cliente = clientes.find(
            item => String(item.id) === String(id)
        );


        if (!cliente) {
            return;
        }


        const confirmar = confirm(
            "Deseja excluir o cliente " +
            cliente.nome +
            "?"
        );


        if (!confirmar) {
            return;
        }


        const novosClientes = clientes.filter(
            item => String(item.id) !== String(id)
        );


        salvarClientes(novosClientes);

        mostrarClientes();

        alert("Cliente excluído.");

    }


    function mostrarClientes() {

        const lista =
            document.getElementById("listaClientes");

        const pesquisa =
            document.getElementById("pesquisa")
                .value
                .trim()
                .toLowerCase();


        const clientes = obterClientes();


        const filtrados = clientes.filter(cliente => {

            const nome =
                (cliente.nome || "").toLowerCase();

            const telefone =
                (cliente.telefone || "").toLowerCase();

            const bairro =
                (cliente.bairro || "").toLowerCase();

            return (
                nome.includes(pesquisa) ||
                telefone.includes(pesquisa) ||
                bairro.includes(pesquisa)
            );

        });


        document.getElementById("contador").textContent =
            filtrados.length +
            (filtrados.length === 1
                ? " cliente"
                : " clientes");


        if (filtrados.length === 0) {

            lista.innerHTML = `

                <div class="vazio">

                    <span>👥</span>

                    <strong>
                        Nenhum cliente encontrado
                    </strong>

                    <p style="margin-top:6px;font-size:12px;">
                        Cadastre seu primeiro cliente acima.
                    </p>

                </div>

            `;

            return;

        }


        lista.innerHTML = filtrados.map(cliente => {

            const enderecoCompleto =
                [cliente.endereco, cliente.bairro]
                    .filter(Boolean)
                    .join(" - ");


            return `

                <div class="cliente">

                    <div class="cliente-topo">

                        <div class="avatar">
                            👤
                        </div>

                        <div class="cliente-nome">

                            <strong>
                                ${escaparHTML(cliente.nome)}
                            </strong>

                            <small>
                                ${cliente.telefone
                                    ? escaparHTML(cliente.telefone)
                                    : "Telefone não informado"}
                            </small>

                        </div>

                    </div>


                    <div class="cliente-info">

                        ${
                            enderecoCompleto
                            ? "📍 " + escaparHTML(enderecoCompleto)
                            : "📍 Endereço não informado"
                        }

                        ${
                            cliente.observacao
                            ? "<br>📝 " +
                              escaparHTML(cliente.observacao)
                            : ""
                        }

                    </div>


                    <div class="acoes">

                        <button
                            class="btn-editar"
                            onclick="editarCliente(${cliente.id})"
                        >
                            ✏️ EDITAR
                        </button>

                        <button
                            class="btn-excluir"
                            onclick="excluirCliente(${cliente.id})"
                        >
                            🗑️ EXCLUIR
                        </button>

                    </div>

                </div>

            `;

        }).join("");

    }


    function escaparHTML(texto) {

        return String(texto)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    mostrarClientes();

</script>

</body>
</html>
